<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#050509"/>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#0d0d1e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <!-- Border glow -->
  <rect x="2" y="2" width="188" height="188" rx="30" fill="none" stroke="#00ff8833" stroke-width="2"/>
  <!-- </> symbol -->
  <text x="96" y="114" font-family="'JetBrains Mono','Courier New',monospace" font-size="72" font-weight="900" fill="url(#glow)" text-anchor="middle" letter-spacing="-4">&lt;/&gt;</text>
</svg>
